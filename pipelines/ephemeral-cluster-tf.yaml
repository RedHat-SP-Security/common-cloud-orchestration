---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ephemeral-cluster-nbde-tang-server-e2e-tests-pipeline
spec:
  description: |
    This pipeline automates the process of running end-to-end tests for NBDE tang-server
    using a Hypershift cluster. The pipeline provisions
    the Hypershift cluster, runs the tests in TF machine, collects artifacts,
    and deprovisions the Hypershift cluster.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      type: string
    - name: GIT_URL
      description: URL of the GIT repository that contains the tests.
      type: string
    - name: GIT_REF
      default: "main"
      description: Branch of the git repository used containing the tests
      type: string
    - name: KONFLUX_FMF_PLAN
      default: "/Plans/konflux_ci_cluster_Provisioned"
      type: string
      description: Plan which will be executed in tmt.
    - name: TIMEOUT
      default: "720"
      description: Set the timeout for the request in minutes. If the test takes longer than this, it will be terminated.
      type: string
    - name: ARCH
      default: "x86_64"
      description: Comma-separated list of architectures to run against.
      type: string
    - name: DISTRO
      default: "RHEL-9.3"
      type: string
      description: Context of OS which will be set to TF.
    - name: TESTING_FARM_API_URL
      default: https://api.dev.testing-farm.io/v0.1
      description: The testing-farm instance API to use
    - name: COMPOSE
      default: "RHEL-9.3.0-Nightly"
      description: Compose to use for the system-under-test.
      type: string
    - name: INDEX_OCP_VER
      default: "0"
      type: string
      description: Index which is used for setting release of OCP cluser.
    - name: RELEASE_STREAM
      default: 4-stable-multi
      type: string
      description: OpenShift release stream used to discover OCP minor versions.
    - name: COMPUTE_NODE_TYPE
      default: m5.large
      type: string
      description: AWS instance type for ephemeral HyperShift worker nodes.
    - name: HOSTED_MANAGEMENT_CLUSTER
      default: hosted-mgmt2
      type: string
      description: Hosted management cluster used to provision the ephemeral cluster.
  results:
    - name: TEST_OUTPUT
      value: "$(tasks.nbde-e2e-tests.results.TEST_OUTPUT)"
  tasks:
    - name: resolve-ocp-version
      params:
        - name: INDEX_OCP_VER
          value: $(params.INDEX_OCP_VER)
        - name: RELEASE_STREAM
          value: $(params.RELEASE_STREAM)
      taskSpec:
        params:
          - name: INDEX_OCP_VER
            type: string
          - name: RELEASE_STREAM
            type: string
        results:
          - name: OCP_VERSION
            description: OCP minor version selected from the release stream.
        steps:
          - name: resolve-version
            image: quay.io/konflux-ci/konflux-test:latest
            env:
              - name: INDEX_OCP_VER
                value: $(params.INDEX_OCP_VER)
              - name: RELEASE_STREAM
                value: $(params.RELEASE_STREAM)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              if ! [[ "${INDEX_OCP_VER}" =~ ^[0-9]+$ ]]; then
                echo "INDEX_OCP_VER must be a non-negative integer" >&2
                exit 1
              fi

              RELEASE_API="https://multi.ocp.releases.ci.openshift.org/api/v1"
              RELEASE_DATA="$(
                curl --fail --silent --show-error \
                  "${RELEASE_API}/releasestream/${RELEASE_STREAM}/tags?phase=Accepted"
              )"

              MINOR_VERSIONS="$(
                jq -r '
                  .tags[].name
                  | capture("^(?<minor>[0-9]+\\.[0-9]+)\\.[0-9]+$")
                  | .minor
                ' <<< "${RELEASE_DATA}"
              )"

              SORTED_VERSIONS="$(
                sort --version-sort --unique --reverse <<< "${MINOR_VERSIONS}"
              )"

              mapfile -t OCP_VERSIONS <<< "${SORTED_VERSIONS}"
              OCP_VERSION="${OCP_VERSIONS[$INDEX_OCP_VER]:-}"

              if [[ -z "${OCP_VERSION}" ]]; then
                echo "INDEX_OCP_VER is out of range" >&2
                exit 1
              fi

              printf '%s' "${OCP_VERSION}" > "$(results.OCP_VERSION.path)"
    - name: provision-cluster
      runAfter:
        - resolve-ocp-version
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: env
          value: |
            {
              "COMPUTE_NODE_TYPE": "$(params.COMPUTE_NODE_TYPE)",
              "HOSTED_MANAGEMENT_CLUSTER": "$(params.HOSTED_MANAGEMENT_CLUSTER)"
            }
        - name: releases
          value: {"latest":{"release":{"channel":"stable","version":"$(tasks.resolve-ocp-version.results.OCP_VERSION)","architecture":"multi"}}}
    - name: nbde-e2e-tests
      timeout: "5h"
      description: Task to run tests from service repository
      runAfter:
        - provision-cluster
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
            description: Secret containing the ephemeral cluster credentials.
        results:
          - description: Link to the Testing Farm result overview
            name: TEST_OUTPUT
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: testing-farm-secret
            secret:
              secretName: testing-farm-secret
        steps:
          - name: testing-farm-request
            volumeMounts:
              - name: credentials
                mountPath: /credentials
                readOnly: true
              - name: testing-farm-secret
                mountPath: "/etc/secrets"
                readOnly: true
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: TIMEOUT
                value: $(params.TIMEOUT)
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: GIT_URL
                value: $(params.GIT_URL)
              - name: GIT_REF
                value: $(params.GIT_REF)
              - name: KONFLUX_FMF_PLAN
                value: $(params.KONFLUX_FMF_PLAN)
              - name: TESTING_FARM_API_URL
                value: $(params.TESTING_FARM_API_URL)
              - name: COMPOSE
                value: $(params.COMPOSE)
              - name: DISTRO
                value: $(params.DISTRO)
              - name: ARCH
                value: $(params.ARCH)
            image: quay.io/testing-farm/cli:latest
            script: |
              #!/usr/bin/env bash
              echo "=====TF request========"
              export TESTING_FARM_API_TOKEN=$(cat /etc/secrets/testing-farm-token)
              REQUEST_CMD='testing-farm request \
                --environment SNAPSHOT="'$(echo ${SNAPSHOT} | base64 -w 0)'" \
                --environment KUBECONFIG_CONTENT="'$(cat ${KUBECONFIG} | base64 -w 0)'" \
                --git-url "'${GIT_URL}'" \
                --git-ref "'${GIT_REF}'" \
                --plan "'${KONFLUX_FMF_PLAN}'" \
                --compose "'${COMPOSE}'" \
                --arch "'${ARCH}'" \
                --timeout "'${TIMEOUT}'" \
                --skip-summary \
                --context distro="'${DISTRO}'"'
              # Print the constructed command for debugging purposes
              echo "Executing command: $REQUEST_CMD "
              OUTPUT_FILE="tf_results.txt"
              eval "$REQUEST_CMD" | tee $OUTPUT_FILE
              ARTIFACTS_URL=$(grep 'artifacts' $OUTPUT_FILE | grep -o 'https://[^[:space:]]\+')
              if grep -q "tests failed" $OUTPUT_FILE; then
                echo "Test FAILED"
                TEST_OUTPUT_RESULT_PATH='{"result":"FAILURE","timestamp":"'"$(date -u +%s)"'","successes":0,"failures":1,"warnings":0,"note":"'"${ARTIFACTS_URL}"'"}'
                echo $TEST_OUTPUT_RESULT_PATH > $(results.TEST_OUTPUT.path)
                exit 1
              elif grep -q "tests passed" $OUTPUT_FILE; then
                echo "Test PASSED"
                TEST_OUTPUT_RESULT_PATH='{"result":"SUCCESS","timestamp":"'"$(date -u +%s)"'","successes":1,"failures":0,"warnings":0,"note":"'"${ARTIFACTS_URL}"'"}'
                echo $TEST_OUTPUT_RESULT_PATH > $(results.TEST_OUTPUT.path)
                exit 0
              elif grep -q "tests error" $OUTPUT_FILE; then
                echo "Test ERRORED"
                TEST_OUTPUT_RESULT_PATH='{"result":"ERROR","timestamp":"'"$(date -u +%s)"'","successes":0,"failures":1,"warnings":0,"note":"'"${ARTIFACTS_URL}"'"}'
                echo $TEST_OUTPUT_RESULT_PATH > $(results.TEST_OUTPUT.path)
                exit 1
              fi
